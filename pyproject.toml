[project]
name = "lorahub"
# Version is dynamic — derived from git tags by hatch-vcs at build time.
# Tagging `vX.Y.Z` and `pip install -e .` (or building a wheel) writes the
# resolved string into `lorahub/_version.py`. Between tags hatch-vcs emits
# a PEP 440 dev version like `0.3.0.post12+g1a2b3c4` so untagged commits
# never collide with a release.
dynamic = ["version"]
description = "Open-source LoRA training workbench for diffusion models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "GALIAIS", email = "GALIAIS@users.noreply.github.com" }]
keywords = ["lora", "stable-diffusion", "sdxl", "kohya", "training", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "platformdirs>=4.2",
    "ulid-py>=1.1",
    "huggingface_hub>=0.24",
    "pillow>=10.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# The two ONNX Runtime distributions install the same ``onnxruntime`` module
# and must not coexist. Installers and CI request ``cpu`` explicitly; GPU
# images request only ``gpu``.
cpu = ["onnxruntime>=1.18"]
gpu = ["onnxruntime-gpu>=1.18"]
tagging = [
    # JoyTag inference: needs PyTorch + safetensors. Torch is intentionally
    # not pinned to a CUDA build here — pick the right wheel from
    # https://pytorch.org/get-started/locally/ or rely on the CPU build.
    "torch>=2.1",
    "safetensors>=0.4",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "psutil>=5.9",
    "python-multipart>=0.0.9",
    "py7zr>=0.22,<1",
    # API-side LoRA spectral analysis reads saved adapter checkpoints.
    "safetensors>=0.4",
]
sweep = [
    # Optional: TPE / Bayesian search for the hyperparameter sweep
    # endpoints. Grid + random search are always available.
    "optuna>=3.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "httpx>=0.27",
    # Reuse the api extra rather than redeclaring fastapi / uvicorn /
    # python-multipart / websockets — pip resolves the include and the
    # dev install picks up future api-extra updates automatically.
    "lorahub[api]",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.scripts]
lorahub = "lorahub.cli.main:main"

[project.urls]
Homepage = "https://github.com/GALIAIS/LoraHub"
Repository = "https://github.com/GALIAIS/LoraHub"
Issues = "https://github.com/GALIAIS/LoraHub/issues"
Changelog = "https://github.com/GALIAIS/LoraHub/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Read the version from git: the most recent `vX.Y.Z` tag wins. Local
# fallback (no tags yet) is `0.0.0`, so editable installs in a fresh
# clone still succeed.
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
# Tags use the `v` prefix (semantic-release convention). The pattern
# is forwarded to setuptools-scm under the hood; restricting it stops
# stray annotated tags (`docs-v1`, `release-2026-05`) from being
# picked up as a project version.
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+(?:[a-zA-Z0-9.+-]*)?)$"

[tool.hatch.build.hooks.vcs]
# Materialise the resolved version into `lorahub/_version.py` whenever
# the package is built or installed editable, so `from lorahub import
# __version__` works at runtime without a hatch-vcs runtime dependency.
version-file = "lorahub/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["lorahub"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored anima_lora (third backend's source tree). Owned upstream;
# linting it would drown signal from our own code in noise. Mypy
# already ignores it via the per-module override below.
extend-exclude = ["external/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RET", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests use B011 (assert False) and SIM nesting freely; the rest of
# B / SIM still applies to keep test code readable.
"tests/**" = ["B011", "SIM117", "SIM102"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

# Per-module ``ignore_missing_imports`` overrides. Setting this
# globally (the previous behaviour) silently disabled strict mode for
# *every* dependency, defeating the point of `strict = true`. Only
# the libraries that genuinely don't ship type stubs are listed here.
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "onnxruntime.*",
    "huggingface_hub.*",
    "platformdirs.*",
    "psutil.*",
    "ulid.*",
    "websockets.*",
    "uvicorn.*",
    "optuna.*",
    "safetensors.*",
    "PIL.*",
    "cv2.*",
    "diffusers.*",
    "py7zr.*",
    "tqdm.*",
    "wandb.*",
    "yaml",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: end-to-end / integration tests that take >1s — opt in with `-m slow`",
    "gpu: requires a working CUDA / Metal device; skipped by default",
    "integration: spans multiple subsystems (registry + scheduler + store)",
]
filterwarnings = [
    # Treat unflagged DeprecationWarnings as errors so we don't ship
    # past a warning we've ignored. Tests that legitimately need a
    # noisy dependency can opt out with @pytest.mark.filterwarnings.
    "error::DeprecationWarning",
    # ── known-noisy upstream warnings, keep at default level ─────
    "default::DeprecationWarning:huggingface_hub",
    "default::DeprecationWarning:pydantic",
    "default::DeprecationWarning:websockets",
]
