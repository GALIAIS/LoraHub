[project]
name = "lorahub"
version = "0.1.0.dev0"
description = "Open-source LoRA training workbench for diffusion models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "GALIAIS", email = "GALIAIS@users.noreply.github.com" }]
keywords = ["lora", "stable-diffusion", "sdxl", "kohya", "training", "ai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "platformdirs>=4.2",
    "ulid-py>=1.1",
    "huggingface_hub>=0.24",
    "onnxruntime>=1.18",
    "pillow>=10.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
lorahub = "lorahub.cli.main:app"

[project.urls]
Homepage = "https://github.com/GALIAIS/LoraHub"
Repository = "https://github.com/GALIAIS/LoraHub"
Issues = "https://github.com/GALIAIS/LoraHub/issues"
Changelog = "https://github.com/GALIAIS/LoraHub/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lorahub"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RET", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
