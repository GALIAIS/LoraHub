# Anima style LoRA on the anima_lora backend — 8GB laptop recipe.
#
# Target hardware: laptop RTX 30/40 series with 8 GB VRAM.
# Expected throughput: ~6-8 s/step (the swap + checkpointing tax is real).
# Expected VRAM peak: ~7.0-7.5 GB at 768²; bump to 1024² only if you can
# verify under 8 GB on your card first.
#
# What separates this from anima_character_8gb_dora.yaml:
#   - algorithm = loha (effective rank up to r²; better at multi-scale
#     texture / colour / brush coupling than plain LoRA at the same r)
#   - 768² resolution (the 1024² latent + LoHA's 4 matrices per Linear
#     do not co-exist with 8 GB VRAM)
#   - heavier caption dropout for style generalisation
#   - fewer epochs (style converges faster than identity on small sets)
#
# Style training intuition (same as the 32GB recipe, scaled down):
#   1. captionDropoutRate 0.15 — represent style outside any caption
#   2. numRepeats 4 — keep total step count manageable on a laptop
#   3. LoHA r=8 — effective rank up to 64, plenty for style without
#      cementing per-image composition memorisation

schemaVersion: "1.0"

baseModel:
  arch: anima
  checkpoint: ./models/diffusion_models/anima-base-v1.0.safetensors
  archPaths:
    qwen3: ./models/text_encoders/qwen_3_06b_base.safetensors
    ae: ./models/vae/qwen_image_vae.safetensors
    # 384 fits comfortably in 8 GB; the 1024 default would push the
    # text-encoder cache past the VRAM headroom we left for activations.
    qwen3MaxTokenLength: 384

dataset:
  source: ./datasets/your_style
  resolution: [768, 768]
  bucket:
    enabled: true
    # Wider AR than character — style mixes portrait / landscape /
    # scene crops more often.
    min: 384
    max: 1280
    step: 64
  caption:
    strategy: tag_file
    ext: .txt
    shuffle: true
    # Heavier than character (8GB DoRA uses 0.10) — style should
    # generalise to prompts you never tagged.
    dropRate: 0.15
    keepTokens: 1
  numRepeats: 4

schedule:
  epochs: 8
  batchSize: 1
  gradAccum: 8
  seed: 42

precision: bf16
gradientCheckpointing: true
cacheLatents: true
cacheLatentsToDisk: true
skipCacheCheck: true

output:
  name: your_style_anima_8gb
  saveEveryNEpochs: 2
  saveDtype: bf16

backend:
  type: anima_lora
  animaLora:
    method: lora
    preset: low_vram
    outputName: your_style_anima_8gb

    # Algorithm: LoHA.
    # Effective rank is ``r²`` so r=8 here is comparable in expressive
    # power to a r≈64 plain LoRA, at 4× the parameter cost (vs r=8 plain
    # LoRA). Going higher quickly hits OOM at 8 GB because LoHA stores
    # 4 matrices per Linear (vs LoRA's 2).
    lora:
      algorithm: loha
      useTimestepMask: false

    networkDim: 8
    networkAlpha: 8.0
    networkTrainUnetOnly: true

    # AdamW8bit shaves ~3 GB optimiser state vs full-precision AdamW —
    # essential at 8 GB.
    optimizerType: AdamW8bit
    lrScheduler: cosine
    # Style trains faster than identity; 7e-5 keeps the gradient gentle
    # enough that multi-image variety lands as style rather than as
    # per-image composition.
    learningRate: 7.0e-05
    maxTrainEpochs: 8
    saveEveryNEpochs: 2
    checkpointingEpochs: 2
    captionDropoutRate: 0.15

    # Flow-matching sampling.
    timestepSampling: sigmoid
    sigmoidScale: 1.0
    discreteFlowShift: 1.0
    weightingScheme: min_snr_rf
    minSnrGamma: 5.0

    # EMA on for laptops — the smoothed weights compensate for the
    # noisy gradients that batch=1 + accum=8 produce. Forces
    # ``compileInductorMode=default`` (set below) because reduce-overhead
    # cudagraph_trees crashes with EMA.
    ema: true
    emaDecay: 0.999
    emaUseNumUpdates: true

    # Bookkeeping safety nets.
    nanGuard: true
    nanGuardRecover: true
    nanGuardMaxConsecutive: 5

    # Caching — full fanout to avoid re-encoding every epoch.
    cacheLatents: true
    cacheLatentsToDisk: true
    cacheTextEncoderOutputs: true
    cacheTextEncoderOutputsToDisk: true
    cacheLlmAdapterOutputs: true
    useShuffledCaptionVariants: true
    staticTokenCount: 4096
    # vaeChunkSize=1 trades throughput for a flat ~150 MB VAE peak —
    # critical at 8 GB; the 64 setting the 32GB recipe uses would OOM.
    vaeChunkSize: 1

    attnMode: torch

    # Compile: keep cudagraph_trees off because EMA above is on. The
    # ``default`` Inductor mode still benefits from the regular
    # torch.compile pass without the cudagraph trees pitfall.
    torchCompile: false
    compileInductorMode: default
    useCustomDownAutograd: true

    # Memory / offload — the meat of the 8GB story.
    # 24 transformer blocks streamed off the GPU at any one time leaves
    # only the active block + adapters resident. Mutually exclusive
    # with cpuOffloadCheckpointing in train.py — keep this, drop that.
    blocksToSwap: 24
    gradientCheckpointing: true
    unslothOffloadCheckpointing: true
    cpuOffloadCheckpointing: false
    mixedPrecision: bf16

    # No CMMD validation on a laptop; the eval pass spike would push
    # us into OOM territory.
    useCmmd: false
    maskedLoss: true

    saveModelAs: safetensors
    savePrecision: bf16
    logEveryNSteps: 5
    keepTokens: 1
    captionExtension: .txt
    enableBucket: true
    pathPattern: '*'

resume:
  saveState: true
  saveStateAtEnd: true
