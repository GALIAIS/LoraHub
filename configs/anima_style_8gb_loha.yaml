schemaVersion: '1.0'
baseModel:
  arch: anima
  archVariant: ''
  checkpoint: models\circlestone-labs__Anima\anima-base-v1.0.safetensors
  archPaths:
    ae: models\circlestone-labs__Anima\qwen_image_vae.safetensors
    qwen3: models\circlestone-labs__Anima\qwen_3_06b_base.safetensors
    qwen3MaxTokenLength: 384
    applyT5AttnMask: false
    applyLgAttnMask: false
    t5DropoutRate: 0.0
    clipLDropoutRate: 0.0
    clipGDropoutRate: 0.0
    posEmbRandomCropRate: 0.0
    enableScaledPosEmbed: false
    vaeDisableCache: false
    textEncoderCpu: false
dataset:
  source: datasets\thornsdance
  resolution:
  - 768
  - 768
  bucket:
    enabled: true
    min: 384
    max: 1280
    step: 64
    noUpscale: false
    skipImageResolution: false
  caption:
    strategy: tag_file
    ext: .txt
    shuffle: true
    dropRate: 0.15
    dropoutEveryNEpochs: 0
    tagDropoutRate: 0.0
    keepTokens: 1
    dropTokens: []
    enableWildcard: false
    weighted: false
    shuffleTags: false
  numRepeats: 4
  valSplit: 0.0
  subsets: []
  frameBuckets:
  - 1
network:
  type: lora
  rank: 32
  alpha: 16
  targetUnet: true
  targetTextEncoder: false
  networkDropout: 0.0
  rankDropout: 0.0
  moduleDropout: 0.0
  baseWeights: []
  baseWeightsMultiplier: []
  fuseAdapters: []
optimizer:
  type: adamw8bit
  lr:
    unet: 0.0001
    textEncoder: 5.0e-05
  schedule: cosine_with_restarts
  warmupSteps: 100
  betas:
  - 0.9
  - 0.999
  weightDecay: 0.0
  eps: 1.0e-08
  optimizerArgs: {}
  maxGradNorm: 1.0
  schedulerArgs: {}
  schedulerNumCycles: 1
  schedulerPower: 1.0
  gradientRelease: false
loss:
  noiseOffset: 0.0
  noiseOffsetRandomStrength: false
  multiresNoiseDiscount: 0.3
  ipNoiseGammaRandomStrength: false
  zeroTerminalSnr: false
  priorLossWeight: 1.0
  lossType: l2
  debiasedEstimation: false
  maskedLoss: false
  scaleVPredLossLikeNoisePred: false
  vParameterization: false
flowMatch: {}
schedule:
  epochs: 8
  batchSize: 1
  gradAccum: 8
  seed: 42
precision: bf16
gradientCheckpointing: true
cacheLatents: true
cacheLatentsToDisk: true
skipCacheCheck: true
cacheInfo: false
trainInpainting: false
sampling:
  enabled: false
  everyNEpochs: 1
  atFirst: false
  resolution:
  - 1024
  - 1024
  seed: 42
  enableLiveInference: false
  inferenceSteps: 24
  inferenceCfg: 5.0
output:
  name: style_anima_8gb
  saveEveryNEpochs: 2
  saveDtype: bf16
  noMetadata: false
  metadata: {}
backend:
  type: anima_lora
  extraArgs: {}
  animaLora:
    method: lora
    preset: low_vram
    outputName: style_anima_8gb
    networkModule: networks.lora_anima
    networkDim: 8
    networkAlpha: 8.0
    networkTrainUnetOnly: true
    optimizerType: AdamW8bit
    lrScheduler: cosine
    learningRate: 7.0e-05
    maxTrainEpochs: 8
    saveEveryNEpochs: 2
    checkpointingEpochs: 2
    captionDropoutRate: 0.15
    timestepSampling: sigmoid
    sigmoidScale: 1.0
    discreteFlowShift: 1.0
    weightingScheme: min_snr_rf
    minSnrGamma: 5.0
    ema: true
    emaDecay: 0.999
    emaUseNumUpdates: true
    nanGuard: true
    nanGuardRecover: true
    nanGuardMaxConsecutive: 5
    sampleGrid: false
    cacheLatents: true
    cacheLatentsToDisk: true
    cacheTextEncoderOutputs: true
    cacheTextEncoderOutputsToDisk: true
    cacheLlmAdapterOutputs: true
    useShuffledCaptionVariants: true
    staticTokenCount: 4096
    vaeChunkSize: 1
    vaeDisableCache: false
    noHalfVae: false
    attnMode: torch
    xformers: false
    splitAttn: false
    compileInductorMode: default
    useCustomDownAutograd: true
    blocksToSwap: 24
    gradientCheckpointing: true
    unslothOffloadCheckpointing: true
    # cpu_offload_checkpointing is mutually exclusive with blocks_to_swap
    # in anima_lora's train.py — keep blocks_to_swap, drop this.
    cpuOffloadCheckpointing: false
    mixedPrecision: bf16
    useCmmd: false
    maskedLoss: true
    torchCompile: false
    skipCacheCheck: true
    dataloaderPinMemory: true
    persistentDataLoaderWorkers: false
    trimCrossattnKv: false
    saveModelAs: safetensors
    savePrecision: bf16
    logEveryNSteps: 5
    keepTokens: 1
    captionExtension: .txt
    validationSplitNum: 0
    enableBucket: true
    pathPattern: '*'
    lora:
      algorithm: loha
      lokrFactor: 8
      boftFactors: 4
      useTimestepMask: false
      minRank: 8
      alphaRankScale: 1.0
resume:
  saveState: true
  saveStateAtEnd: true
  skipUntilInitialStep: false
validation:
  everyNEpochs: 1
attention:
  training: auto
  split: false
optimization:
  torchCompile: false
  fusedBackwardPass: false
  fullBf16: false
  fullFp16: false
  blocksToSwap: 0
  fp8Base: false
  fp8BaseUnet: false
  fp8Scaled: false
  fp8VlTextEncoder: false
  lowram: false
  highvram: false
  noHalfVae: false
  disableMmapLoadSafetensors: false
  cpuOffloadCheckpointing: false
  unslothOffloadCheckpointing: false
  cacheTextEncoderOutputs: false
  cacheTextEncoderOutputsToDisk: false
dataloader:
  numWorkers: 8
  persistentWorkers: false
  vaeBatchSize: 1
  cacheShuffleNum: 0
augmentation:
  flip: false
  color: false
  randomCrop: false
  alphaMask: false
