schemaVersion: '1.0'
baseModel:
  arch: anima
  archVariant: ''
  checkpoint: models\circlestone-labs__Anima\anima-base-v1.0.safetensors
  archPaths:
    ae: models\circlestone-labs__Anima\qwen_image_vae.safetensors
    qwen3: models\circlestone-labs__Anima\qwen_3_06b_base.safetensors
    applyT5AttnMask: false
    applyLgAttnMask: false
    t5DropoutRate: 0.0
    clipLDropoutRate: 0.0
    clipGDropoutRate: 0.0
    posEmbRandomCropRate: 0.0
    enableScaledPosEmbed: false
    vaeDisableCache: false
    textEncoderCpu: false
dataset:
  source: datasets\your_dataset
  resolution:
  - 1024
  - 1024
  bucket:
    enabled: true
    min: 256
    max: 2048
    step: 64
    noUpscale: false
    skipImageResolution: false
  caption:
    strategy: tag_file
    ext: .txt
    shuffle: true
    dropRate: 0.1
    dropoutEveryNEpochs: 0
    tagDropoutRate: 0.0
    keepTokens: 3
    dropTokens: []
    enableWildcard: false
    weighted: false
    shuffleTags: false
  numRepeats: 1
  valSplit: 0.0
  subsets: []
  frameBuckets:
  - 1
network:
  type: lora
  rank: 16
  alpha: 16
  targetUnet: true
  targetTextEncoder: false
  networkDropout: 0.0
  rankDropout: 0.0
  moduleDropout: 0.0
  baseWeights: []
  baseWeightsMultiplier: []
  fuseAdapters: []
optimizer:
  type: AdamW
  lr:
    unet: 5.0e-05
    textEncoder: 5.0e-05
  schedule: cosine_with_restarts
  warmupSteps: 100
  betas:
  - 0.9
  - 0.999
  weightDecay: 0.0
  eps: 1.0e-08
  optimizerArgs: {}
  maxGradNorm: 1.0
  schedulerArgs: {}
  schedulerNumCycles: 1
  schedulerPower: 1.0
  gradientRelease: false
loss:
  noiseOffset: 0.0
  noiseOffsetRandomStrength: false
  multiresNoiseDiscount: 0.3
  ipNoiseGammaRandomStrength: false
  zeroTerminalSnr: false
  priorLossWeight: 1.0
  lossType: l2
  debiasedEstimation: false
  maskedLoss: false
  scaleVPredLossLikeNoisePred: false
  vParameterization: false
flowMatch: {}
schedule:
  epochs: 8
  batchSize: 1
  gradAccum: 1               # 上游 base.toml effective batch_size=1
  seed: 42
precision: bf16
gradientCheckpointing: true
cacheLatents: true
cacheLatentsToDisk: false
skipCacheCheck: false
cacheInfo: false
trainInpainting: false
sampling:
  enabled: true
  everyNEpochs: 2            # 减少训练打断，每 2 epoch 一次 sample
  atFirst: true
  prompts:
  - prompt: masterpiece, best quality, score_7, ${TRIGGER}, 1girl, solo, upper body,
      looking at viewer, neutral expression, simple background, soft natural lighting
    negative: lowres, worst quality, bad anatomy, bad hands, missing fingers, blurry,
      jpeg artifacts, deformed, mutated, watermark, signature, text
    cfg: 5.0
    steps: 28
    seed: 42
    width: 1024
    height: 1024
  - prompt: masterpiece, best quality, score_7, ${TRIGGER}, 1girl, solo, full body,
      standing, dynamic pose, looking at viewer, outdoors, daytime, soft sunlight
    negative: lowres, worst quality, bad anatomy, bad hands, missing fingers, extra
      fingers, blurry, jpeg artifacts, deformed, mutated, watermark, text
    cfg: 5.0
    steps: 28
    seed: 1024
    width: 832
    height: 1216
  - prompt: masterpiece, best quality, score_7, ${TRIGGER}, 1girl, solo, close-up,
      smiling, blush, looking at viewer, indoor warm lighting, bokeh background
    negative: lowres, worst quality, bad anatomy, bad hands, blurry, jpeg artifacts,
      deformed, mutated, watermark, text, sad, angry
    cfg: 5.0
    steps: 28
    seed: 7777
    width: 896
    height: 1152
  - prompt: masterpiece, best quality, score_7, ${TRIGGER}, 2girls, multiple girls,
      sitting together, casual conversation, indoor, daytime
    negative: lowres, worst quality, bad anatomy, bad hands, blurry, jpeg artifacts,
      deformed, watermark, text
    cfg: 5.0
    steps: 28
    seed: 256
    width: 1024
    height: 1024
  - prompt: masterpiece, best quality, score_7, ${TRIGGER}, scenery, no humans, mountain
      landscape, river, autumn forest, dramatic clouds, golden hour, cinematic
    negative: lowres, worst quality, blurry, jpeg artifacts, watermark, text, signature,
      person, character, human
    cfg: 5.0
    steps: 28
    seed: 8888
    width: 1344
    height: 768
  - prompt: masterpiece, best quality, score_7, ${TRIGGER}, 1girl, solo, urban night,
      neon signs, rain, reflective wet ground, dramatic rim light, looking back over
      shoulder
    negative: lowres, worst quality, bad anatomy, bad hands, blurry, jpeg artifacts,
      deformed, watermark, text, daytime, sunny, grayscale
    cfg: 5.5
    steps: 30
    seed: 31415
    width: 1216
    height: 832
  resolution:
  - 1024
  - 1024
  seed: -1
  outputs:
    gridStitching: true
    baseCompare: false
    crossCkptAnimation: false
    pngMetadata: true
  enableLiveInference: false
  inferenceSteps: 24
  inferenceCfg: 5.0
  spectrumAnalysis: true
output:
  name: anima_lora
  saveEveryNEpochs: 1
  saveDtype: fp16
  noMetadata: false
  metadata: {}
backend:
  type: anima_lora
  extraArgs: {}
  animaLora:
    method: lora
    preset: default
    outputName: anima_lora
    networkModule: networks.lora_anima
    networkDim: 32             # 上游 methods/lora.toml 默认；rank=32 容量更稳
    networkAlpha: 32.0         # 上游默认；与 rank 同值保持 alpha/rank=1.0
    networkTrainUnetOnly: true
    optimizerType: AdamW
    lrScheduler: cosine        # 上游 base.toml 默认；配合 5% warmup 走完整衰减
    learningRate: 2.0e-05      # 上游默认；搭配 cosine + warmup 更稳
    lrWarmupRatio: 0.05        # 5% 总步数 warmup（>=1 视为绝对步数）
    maxTrainEpochs: 3          # 上游 methods/lora.toml 默认 3 epoch
    saveEveryNEpochs: 3        # 与 maxTrainEpochs 对齐
    checkpointingEpochs: 3     # 与 maxTrainEpochs 对齐
    captionDropoutRate: 0.1
    timestepSampling: sigmoid
    sigmoidScale: 1.0
    discreteFlowShift: 1.0
    ema: false
    emaDecay: 0.9999
    emaUseNumUpdates: true
    nanGuard: false
    nanGuardRecover: false
    nanGuardMaxConsecutive: 5
    sampleGrid: false
    cacheLatents: true
    cacheLatentsToDisk: true
    cacheTextEncoderOutputs: true
    cacheTextEncoderOutputsToDisk: true
    cacheLlmAdapterOutputs: true
    useShuffledCaptionVariants: true
    staticTokenCount: 4096
    vaeChunkSize: 64
    vaeDisableCache: true
    noHalfVae: false
    attnMode: flash            # 上游 base.toml 默认；高显存卡用 flash-attn 更快
    xformers: false
    splitAttn: false
    compileMode: blocks
    compileInductorMode: reduce-overhead
    useCustomDownAutograd: true
    blocksToSwap: 0
    gradientCheckpointing: false
    unslothOffloadCheckpointing: false
    cpuOffloadCheckpointing: false
    mixedPrecision: bf16
    useCmmd: false
    maskedLoss: true
    torchCompile: true
    skipCacheCheck: true
    dataloaderPinMemory: true
    persistentDataLoaderWorkers: true   # 上游 base.toml 默认；避免每 epoch 重启 worker
    trimCrossattnKv: false
    saveModelAs: safetensors
    savePrecision: bf16
    logEveryNSteps: 2
    keepTokens: 3
    captionExtension: .txt
    validationSplitNum: 0      # 上游 base.toml 默认；不切验证集
    enableBucket: true
    pathPattern: '*'
    lora:
      algorithm: ortho
      useOrtho: true
      lokrFactor: 8
      boftFactors: 4
      useTimestepMask: true
      minRank: 16              # 上游 methods/lora.toml 默认
      channelScalingAlpha: 0.5 # 上游 methods/lora.toml 默认通道缩放系数
      alphaRankScale: 1.0
resume:
  saveState: true
  saveStateAtEnd: true
  skipUntilInitialStep: false
validation:
  everyNEpochs: 1
attention:
  training: auto
  split: false
optimization:
  torchCompile: false
  fusedBackwardPass: false
  fullBf16: false
  fullFp16: false
  blocksToSwap: 0
  fp8Base: false
  fp8BaseUnet: false
  fp8Scaled: false
  fp8VlTextEncoder: false
  lowram: false
  highvram: false
  noHalfVae: false
  disableMmapLoadSafetensors: false
  cpuOffloadCheckpointing: false
  unslothOffloadCheckpointing: false
  cacheTextEncoderOutputs: false
  cacheTextEncoderOutputsToDisk: false
dataloader:
  numWorkers: 8
  persistentWorkers: false
  vaeBatchSize: 1
  cacheShuffleNum: 0
augmentation:
  flip: false
  color: false
  randomCrop: false
  alphaMask: false
