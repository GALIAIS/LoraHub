# Built-in recipe template: SDXL character LoRA, 8GB-friendly (rank 32 / 1024px).
# REQUIRED before saving: base_model.checkpoint, dataset.source.
# The _template block is metadata for GET /api/recipes/templates and is
# stripped before the document is validated against RecipeConfig.

_template:
  name: SDXL Character
  description: 8GB VRAM friendly SDXL character LoRA (rank 32 / 1024px).
  arch: sdxl

_placeholders:
  - key: name
    label: Recipe / output name
    path_field: output.name
    placeholder: my_character_v1
  - key: checkpoint
    label: SDXL base model checkpoint
    path_field: base_model.checkpoint
    placeholder: C:\models\sdxl_base.safetensors
  - key: dataset
    label: Dataset directory
    path_field: dataset.source
    placeholder: ./datasets/my_character

base_model:
  arch: sdxl
  checkpoint: ""

dataset:
  source: ""
  resolution: [1024, 1024]
  num_repeats: 10

network:
  type: lora
  rank: 32
  alpha: 16
  target_unet: true
  target_text_encoder: false

optimizer:
  type: adamw8bit
  lr:
    unet: 1.0e-4
    text_encoder: 5.0e-5
  schedule: cosine_with_restarts
  warmup_steps: 100

schedule:
  epochs: 10
  batch_size: 1
  grad_accum: 2

precision: bf16
gradient_checkpointing: true
cache_latents: true

sampling:
  enabled: false

output:
  save_dtype: fp16
