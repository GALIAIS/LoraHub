# Built-in config template: SDXL style LoRA (rank 16, trains text encoder, 20 epochs).
# REQUIRED before saving: base_model.checkpoint, dataset.source.
# The _template block is metadata for GET /api/configs/templates and is
# stripped before the document is validated against RecipeConfig.

_template:
  name: SDXL Style
  description: Lower-rank SDXL style LoRA, trains the text encoder for 20 epochs.
  arch: sdxl

_placeholders:
  - key: name
    label: Config / output name
    path_field: output.name
    placeholder: my_style_v1
  - key: checkpoint
    label: SDXL base model checkpoint
    path_field: base_model.checkpoint
    placeholder: C:\models\sdxl_base.safetensors
  - key: dataset
    label: Dataset directory
    path_field: dataset.source
    placeholder: ./datasets/my_style

base_model:
  arch: sdxl
  checkpoint: ""

dataset:
  source: ""
  resolution: [1024, 1024]
  num_repeats: 4

network:
  type: lora
  rank: 16
  alpha: 8
  target_unet: true
  target_text_encoder: true

optimizer:
  type: adamw8bit
  lr:
    unet: 1.0e-4
    text_encoder: 5.0e-5
  schedule: cosine_with_restarts
  warmup_steps: 100

schedule:
  epochs: 20
  batch_size: 1
  grad_accum: 2

precision: bf16
gradient_checkpointing: true
cache_latents: true

sampling:
  enabled: false

output:
  save_dtype: fp16
