# Anima style LoRA — optimised for 24GB VRAM (RTX 4090)
# Backend: diffusion-pipe.
# Style training differs from character training in three ways:
#   1) Lower rank — style is a global aesthetic, not identity detail
#   2) Longer schedule with more variety — many images, fewer repeats
#   3) Higher caption dropout — style should bleed across prompts

schemaVersion: "1.0"

baseModel:
  arch: anima
  checkpoint: ./models/circlestone-labs__Anima/split_files/diffusion_models/anima-base-v1.0.safetensors

dataset:
  source: ./datasets/lx
  resolution: [1024, 1024]
  # Wider AR range than the character recipe — style datasets typically
  # mix portraits, landscapes, full scenes. Bucket step kept at 64 so
  # we don't blow out bucket count.
  bucket:
    enabled: true
    min: 512
    max: 1536
    step: 64
  caption:
    strategy: tag_file
    ext: .txt
    shuffle: true
    # Heavier dropRate than character — style should generalise to
    # captions it has never seen, so half the time the model trains
    # against partial tag sets.
    dropRate: 0.15
  # Style datasets are usually 50-300 images; 4 repeats keeps total
  # steps reasonable while preserving variety.
  numRepeats: 4

network:
  type: lora
  # rank 16 / alpha 8 is the long-standing community sweet spot for
  # style LoRA. Higher rank starts memorising training images instead
  # of abstracting the style.
  rank: 16
  alpha: 8
  targetUnet: true
  # dp/Anima is transformer-only — text encoder LoRA isn't supported.
  # We compensate via heavier caption shuffle + dropRate above.
  targetTextEncoder: false
  # Stronger dropout than the character recipe: 0.10 prevents the LoRA
  # from over-memorising specific tag combinations.
  networkDropout: 0.10

optimizer:
  type: adamw8bit
  lr:
    # Style trains slower than character — 8e-5 keeps the gradient gentle
    # so the LoRA picks up colour/line/shading patterns rather than
    # specific compositions.
    unet: 8.0e-5
    textEncoder: 0
  schedule: cosine
  warmupSteps: 100

schedule:
  # Style benefits from more passes over diverse data; 25 epochs *
  # repeats 4 * ~150 imgs / (batch 2 * accum 2) ~ 7500 steps.
  # If your dataset is smaller (50-100 imgs) cut epochs to 18-20.
  epochs: 25
  batchSize: 2
  gradAccum: 2
  maxSteps: null

precision: bf16
gradientCheckpointing: true
cacheLatents: true

optimization:
  fullBf16: true
  # Adjust per-card: 0 (4090) / 4 (3080-16GB) / 8 (3070-12GB).
  blocksToSwap: 0
  torchCompile: false
  fusedBackwardPass: false

sampling:
  enabled: true
  # Sample alongside checkpoints (every 200 steps) so each saved
  # weight has a matching preview image to judge by.
  everyNSteps: 200
  resolution: [1024, 1024]
  seed: 42
  # 8-prompt default covering portrait / cowboy / full body / group /
  # scene / wide landscape, with @Kiko.L baked in. Edit the file to
  # re-target a different trigger or aesthetic.
  promptsFile: ./configs/sample_prompts/anima_default.txt

output:
  name: lx_anima_style_lora
  # Save every 200 steps. At ~3.7s/step this is one checkpoint every
  # ~12 minutes — frequent enough to catch the sweet spot before the
  # LoRA over-fits, sparse enough to avoid filling disk. Pick the
  # final LoRA by sample quality, not by lowest train loss.
  saveEveryNSteps: 200
  saveDtype: bf16

backend:
  type: diffusion-pipe
  diffusionPipe:
    pipelineStages: 1
    gradientClipping: 1.0
    cachingBatchSize: 4
    stepsPerPrint: 10
    compile: true
    # AR bucket count is the BIGGEST knob for disk usage during the
    # latent-caching pass: dp writes one VAE-encoded copy of every
    # image per bucket it might end up in. Anima at 1024px puts each
    # latent at ~1MB plus ~0.6MB Qwen3 text-encoder cache, so 200
    # images x 11 buckets fills ~35GB before training even starts.
    # 5 buckets covers the typical portrait/landscape/square span
    # without blowing out disk; raise to 7-9 only when the dataset
    # really has unusual aspect ratios.
    minAr: 0.4
    maxAr: 2.5
    numArBuckets: 5
    # Random shuffle of cached latents helps the optimiser see varied
    # styles each step instead of clustering by aspect ratio.
    cacheShuffleNum: 256
    skipEmptyCaption: true
    # NOTE: keys inside `modelPaths` are written verbatim to the diffusion-pipe
    # TOML, so they keep upstream's literal snake_case names (transformer_path
    # / vae_path / llm_path). Don't camelCase these or dp won't recognise them.
    modelPaths:
      transformer_path: ./models/circlestone-labs__Anima/split_files/diffusion_models/anima-base-v1.0.safetensors
      vae_path: ./models/circlestone-labs__Anima/split_files/vae/qwen_image_vae.safetensors
      llm_path: ./models/circlestone-labs__Anima/split_files/text_encoders/qwen_3_06b_base.safetensors
