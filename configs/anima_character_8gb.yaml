# Anima character LoRA — 8GB notebook recipe (e.g. RTX 3070 mobile, RTX 4060 mobile)
# Backend: diffusion-pipe.
# 8GB is the floor for Anima/Qwen-Image LoRA training. Every memory knob is
# pushed to its frugal extreme; expect 5-15s/step instead of the 1-2s/step
# you would see on a 4090. Reduce `blocks_to_swap` and `caching_batch_size`
# back toward the 24GB recipe whenever you have spare VRAM headroom.

schema_version: "1.0"

base_model:
  arch: anima
  checkpoint: ./models/circlestone-labs__Anima/split_files/diffusion_models/anima-base-v1.0.safetensors
  arch_paths:
    transformer: ./models/circlestone-labs__Anima/split_files/diffusion_models/anima-base-v1.0.safetensors
    vae: ./models/circlestone-labs__Anima/split_files/vae/qwen_image_vae.safetensors
    llm: ./models/circlestone-labs__Anima/split_files/text_encoders/qwen_3_06b_base.safetensors
    # Cap qwen3 token length — long captions blow up TE intermediate buffers.
    qwen3_max_token_length: 512
    # Move VAE through in chunks instead of one shot. 8GB cards die on the
    # full image VAE forward at 768px; chunk_size=1 trades latency for VRAM.
    vae_chunk_size: 1

dataset:
  source: ./datasets/azurlane_char0
  # 1024 is the Qwen-Image native resolution but 8GB cannot hold the
  # activations even with full block swap. 768 is the sweet spot on
  # mobile cards: detail loss is minor, VRAM peak drops ~40%.
  # If you have 10-12GB you can push back to 896.
  resolution: [768, 768]
  bucket:
    enabled: true
    min: 384
    max: 1024
    step: 64
  caption:
    strategy: tag_file
    ext: .txt
    shuffle: true
    drop_rate: 0.05
  # 6 repeats keeps total step count bounded — 8GB training is slow,
  # over-repeating wastes hours for marginal quality.
  num_repeats: 6

network:
  type: lora
  # rank 16 / alpha 8 cuts LoRA-side VRAM in half versus the 24GB
  # recipe's rank 32. Character identity still trains well, just with
  # less head-room for fine details.
  rank: 16
  alpha: 8
  target_unet: true
  target_text_encoder: false
  network_dropout: 0.08
  # LoRA in bf16 saves another sliver of VRAM at no quality cost on
  # 30/40 series cards.
  dtype: bf16

optimizer:
  type: adamw8bit
  lr:
    unet: 5.0e-5
    text_encoder: 0
  schedule: cosine
  warmup_steps: 50
  # Slightly tighter clipping than the 4090 recipe — big gradients on
  # very small effective batches can spike loss.
  max_grad_norm: 0.8

schedule:
  # 10 epochs * num_repeats 6 * 30 imgs / (batch 1 * accum 8) ~ 225 steps;
  # at 8s/step this is roughly 30 minutes wall-clock. Adjust epochs up if
  # you have time to spare and the loss curve still looks healthy.
  epochs: 10
  batch_size: 1
  grad_accum: 8
  max_steps: null

precision: bf16
gradient_checkpointing: true
cache_latents: true
# Cached latents go to disk so they never sit in CPU RAM during the run;
# laptops typically pair small VRAM with small RAM so this matters.
cache_latents_to_disk: true

# Memory + speed knobs (lorahub OptimizationConfig)
optimization:
  # Halves optimiser state; combined with adamw8bit optimiser memory is
  # negligible on this size of LoRA.
  full_bf16: true
  # The single biggest VRAM lever on Qwen-Image-style models.
  # Anima has ~60 transformer blocks; swapping 40 keeps roughly 1/3 in VRAM.
  # If you OOM, raise to 48-50 (max is num_blocks-2). If you have spare
  # VRAM, drop to 32 for ~10% speedup.
  blocks_to_swap: 40
  # torch_compile is a kohya knob; dp auto-compiles its own pipeline.
  torch_compile: false
  fused_backward_pass: false

# Sample previews disabled by default — sample generation on 8GB triggers
# its own memory peak that can OOM mid-run. Re-enable only after you've
# seen a few epochs complete cleanly.
sampling:
  enabled: false

output:
  name: azurlane_char0_anima_lora_8gb
  save_every_n_epochs: 2
  save_dtype: bf16

backend:
  type: diffusion-pipe
  diffusion_pipe:
    pipeline_stages: 1
    gradient_clipping: 1.0
    # caching_batch_size=1: 8GB cards run dry during the latent precompute
    # if the VAE batches several images at once. Slower one-time pass,
    # but it stays inside the budget.
    caching_batch_size: 1
    steps_per_print: 5
    # compile=true is essential here — the per-step overhead dp's eager
    # path spends on block swapping is exactly what compile collapses.
    compile: true
    # Reentrant activation checkpointing is required when block_swap is
    # this aggressive (upstream comment in main_example.toml).
    reentrant_activation_checkpointing: true
    # Disable block-swap during eval/sample for speed — eval already uses
    # less memory than training so we can afford keeping blocks resident.
    disable_block_swap_for_eval: true
    # FP8 transformer is the second-biggest VRAM win after block swap.
    # Anima's transformer is Qwen-Image-shaped; float8 weights cut model
    # memory in half. LoRA-on-FP8 training is numerically stable with
    # bf16 optimizer state.
    transformer_dtype: float8_e4m3fn
    # Stick with the upstream-recommended sampler for Qwen-Image LoRA.
    timestep_sample_method: logit_normal
    min_ar: 0.5
    max_ar: 2.0
    num_ar_buckets: 7
    skip_empty_caption: true
