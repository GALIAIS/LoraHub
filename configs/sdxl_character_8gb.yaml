# SDXL character LoRA recipe — tuned for 8GB VRAM (RTX 4070 Laptop / 3060)
# Expects ~20-50 images with tag-file captions in the source directory.

schema_version: "1.0"

base_model:
  arch: sdxl
  checkpoint: ./models/sdxl_base_1.0.safetensors

dataset:
  source: ./datasets/my_character
  resolution: [1024, 1024]
  bucket:
    enabled: true
    min: 256
    max: 2048
    step: 64
  caption:
    strategy: tag_file
    ext: .txt
    shuffle: true
    drop_rate: 0.0
  num_repeats: 10

network:
  type: lora
  rank: 32
  alpha: 16
  target_unet: true
  target_text_encoder: false

optimizer:
  type: adamw8bit
  lr:
    unet: 1.0e-4
    text_encoder: 5.0e-5
  schedule: cosine_with_restarts
  warmup_steps: 100

schedule:
  epochs: 10
  batch_size: 1
  grad_accum: 4
  max_steps: null

precision: bf16
gradient_checkpointing: true
cache_latents: true

sampling:
  enabled: true
  every_n_epochs: 1
  prompts_file: ./prompts/eval.txt
  resolution: [1024, 1024]
  seed: 42

output:
  name: my_character_v1
  save_every_n_epochs: 2
  save_dtype: fp16

backend:
  type: kohya
