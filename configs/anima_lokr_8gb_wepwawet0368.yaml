_template:
  name: WepWaWet0368 Anima LoKr 8GB
  description: 73 图风格训练配置。factorized LoKr、8 个 DiT 块换出、低显存 checkpoint。
  arch: anima

schemaVersion: '1.0'

baseModel:
  arch: anima
  checkpoint: models\circlestone-labs__Anima\anima-base-v1.0.safetensors
  archPaths:
    ae: models\circlestone-labs__Anima\qwen_image_vae.safetensors
    qwen3: models\circlestone-labs__Anima\qwen_3_06b_base.safetensors

dataset:
  source: datasets\WepWaWet0368
  resolution: [768, 768]
  bucket:
    enabled: true
    min: 384
    max: 1024
    step: 64
    noUpscale: false
  caption:
    strategy: tag_file
    ext: .txt
    shuffle: true
    dropRate: 0.12
    keepTokens: 1
  numRepeats: 2
  valSplit: 0.0

network:
  type: lokr
  rank: 8
  alpha: 8
  targetUnet: true
  targetTextEncoder: false

optimizer:
  type: AdamW8bit
  lr:
    unet: 5.0e-05
    textEncoder: 5.0e-05
  schedule: cosine
  warmupSteps: 37
  maxGradNorm: 1.0

schedule:
  epochs: 10
  batchSize: 1
  gradAccum: 2
  seed: 42

precision: bf16
gradientCheckpointing: true
cacheLatents: true
cacheLatentsToDisk: true
skipCacheCheck: true

sampling:
  enabled: true
  everyNEpochs: 2
  atFirst: false
  triggerWord: '@wepwawet0368'
  resolution: [640, 640]
  prompts:
    - prompt: '${TRIGGER}, 1girl, solo, portrait, detailed eyes, simple background, soft lighting'
      negative: 'lowres, worst quality, blurry, bad anatomy, bad hands, watermark, text'
      cfg: 5.0
      steps: 20
      seed: 42
      width: 640
      height: 640
      sampler: euler
    - prompt: '${TRIGGER}, scenery, no humans, forest, river, dramatic clouds, golden hour'
      negative: 'lowres, worst quality, blurry, watermark, text, person, human'
      cfg: 5.0
      steps: 20
      seed: 8888
      width: 768
      height: 512
      sampler: euler
  outputs:
    gridStitching: true
    baseCompare: false
    crossCkptAnimation: false
    pngMetadata: true
  spectrumAnalysis: true

output:
  name: wepwawet0368-anima-lokr-8gb
  saveEveryNEpochs: 2
  saveDtype: bf16

backend:
  type: anima_lora
  gpuDispatch:
    mode: one-job-per-gpu
  animaLora:
    method: lora
    preset: low_vram
    outputName: wepwawet0368-anima-lokr-8gb
    networkModule: networks.lora_anima
    networkDim: 8
    networkAlpha: 8.0
    networkTrainUnetOnly: true
    layerStart: 12
    layerEnd: 28
    targetPreset: attention
    optimizerType: AdamW8bit
    lrScheduler: cosine
    learningRate: 5.0e-05
    lrWarmupRatio: 0.05
    maxTrainEpochs: 10
    saveEveryNEpochs: 2
    checkpointingEpochs: 2
    captionDropoutRate: 0.12
    timestepSampling: sigmoid
    sigmoidScale: 1.0
    discreteFlowShift: 1.0
    weightingScheme: min_snr_rf
    minSnrGamma: 5.0
    cacheLatents: true
    cacheLatentsToDisk: true
    cacheTextEncoderOutputs: true
    cacheTextEncoderOutputsToDisk: true
    cacheLlmAdapterOutputs: true
    useShuffledCaptionVariants: true
    staticTokenCount: null
    vaeChunkSize: 64
    vaeDisableCache: true
    noHalfVae: false
    attnMode: torch
    useCustomDownAutograd: true
    blocksToSwap: 8
    gradientCheckpointing: true
    unslothOffloadCheckpointing: false
    cpuOffloadCheckpointing: false
    mixedPrecision: bf16
    torchCompile: false
    skipCacheCheck: true
    dataloaderPinMemory: true
    persistentDataLoaderWorkers: true
    ema: false
    nanGuard: true
    nanGuardRecover: false
    nanGuardMaxConsecutive: 3
    sampleGrid: false
    useCmmd: false
    validationSplitNum: 0
    saveModelAs: safetensors
    savePrecision: bf16
    logEveryNSteps: 2
    keepTokens: 1
    captionExtension: .txt
    enableBucket: true
    pathPattern: '*'
    lora:
      algorithm: lokr_factorized
      lokrFactor: 8
      minRank: 4
      useTimestepMask: false
      channelScalingAlpha: 0.5

resume:
  saveState: true
  saveStateAtEnd: true

dataloader:
  numWorkers: 2
  persistentWorkers: true
  vaeBatchSize: 1

augmentation:
  flip: true
  color: false
  randomCrop: false
