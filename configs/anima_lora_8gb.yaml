schemaVersion: '1.0'
baseModel:
  arch: anima
  archVariant: ''
  checkpoint: models\circlestone-labs__Anima\anima-base-v1.0.safetensors
  archPaths:
    ae: models\circlestone-labs__Anima\qwen_image_vae.safetensors
    qwen3: models\circlestone-labs__Anima\qwen_3_06b_base.safetensors
    applyT5AttnMask: false
    applyLgAttnMask: false
    t5DropoutRate: 0.0
    clipLDropoutRate: 0.0
    clipGDropoutRate: 0.0
    posEmbRandomCropRate: 0.0
    enableScaledPosEmbed: false
    vaeDisableCache: false
    textEncoderCpu: false
dataset:
  source: datasets\your_dataset
  resolution:
  - 768
  - 768
  bucket:
    enabled: true
    min: 256
    max: 1024
    step: 64
    noUpscale: false
    skipImageResolution: false
  caption:
    strategy: tag_file
    ext: .txt
    shuffle: true
    dropRate: 0.1
    dropoutEveryNEpochs: 0
    tagDropoutRate: 0.0
    keepTokens: 3
    dropTokens: []
    enableWildcard: false
    weighted: false
    shuffleTags: false
  numRepeats: 1
  valSplit: 0.0
  subsets: []
  frameBuckets:
  - 1
network:
  type: lora
  rank: 8
  alpha: 8
  targetUnet: true
  targetTextEncoder: false
  networkDropout: 0.0
  rankDropout: 0.0
  moduleDropout: 0.0
  baseWeights: []
  baseWeightsMultiplier: []
  fuseAdapters: []
optimizer:
  type: AdamW8bit
  lr:
    unet: 5.0e-05
    textEncoder: 5.0e-05
  schedule: cosine_with_restarts
  warmupSteps: 100
  betas:
  - 0.9
  - 0.999
  weightDecay: 0.0
  eps: 1.0e-08
  optimizerArgs: {}
  maxGradNorm: 1.0
  schedulerArgs: {}
  schedulerNumCycles: 1
  schedulerPower: 1.0
  gradientRelease: false
loss:
  noiseOffset: 0.0
  noiseOffsetRandomStrength: false
  multiresNoiseDiscount: 0.3
  ipNoiseGammaRandomStrength: false
  zeroTerminalSnr: false
  priorLossWeight: 1.0
  lossType: l2
  debiasedEstimation: false
  maskedLoss: false
  scaleVPredLossLikeNoisePred: false
  vParameterization: false
flowMatch: {}
schedule:
  epochs: 8
  batchSize: 1
  gradAccum: 4
  seed: 42
precision: bf16
gradientCheckpointing: true
cacheLatents: true
cacheLatentsToDisk: false
skipCacheCheck: false
cacheInfo: false
trainInpainting: false
sampling:
  enabled: true
  everyNEpochs: 2
  atFirst: false
  resolution:
  - 1024
  - 1024
  seed: -1
  enableLiveInference: false
  inferenceSteps: 24
  inferenceCfg: 5.0
  triggerWord: ""              # 留空 → 启动时从 dataset captions 推断
  outputs:
    gridStitching: true
    pngMetadata: true
    baseCompare: false
    crossCkptAnimation: false
  # 8GB 卡 GPU 内存紧张,采样数压到 3 张 + 24 step,跨 epoch 频率减半。需要更
  # 详细的演变追踪请参考 configs/anima_lora_default.yaml 的 6 张采样集。
  # ${TRIGGER} 的解析逻辑同 default 配方:triggerWord 优先 → dataset 推断 → 占位符清除
  prompts:
    - prompt: "masterpiece, best quality, score_7, ${TRIGGER}, 1girl, solo, upper body, looking at viewer, neutral expression, simple background, soft natural lighting"
      negative: "lowres, worst quality, bad anatomy, bad hands, blurry, jpeg artifacts, deformed, watermark, text"
      cfg: 5.0
      steps: 24
      seed: 42
      width: 1024
      height: 1024

    - prompt: "masterpiece, best quality, score_7, ${TRIGGER}, 1girl, solo, full body, standing, outdoors, daytime, soft sunlight"
      negative: "lowres, worst quality, bad anatomy, bad hands, blurry, jpeg artifacts, deformed, watermark, text"
      cfg: 5.0
      steps: 24
      seed: 1024
      width: 832
      height: 1216

    - prompt: "masterpiece, best quality, score_7, ${TRIGGER}, scenery, no humans, mountain landscape, golden hour, cinematic"
      negative: "lowres, worst quality, blurry, jpeg artifacts, watermark, text, person, character, human"
      cfg: 5.0
      steps: 24
      seed: 8888
      width: 1344
      height: 768
output:
  name: anima_lora_8gb
  saveEveryNEpochs: 1
  saveDtype: fp16
  noMetadata: false
  metadata: {}
backend:
  type: anima_lora
  extraArgs: {}
  animaLora:
    method: lora
    preset: low_vram
    outputName: anima_lora_8gb
    networkModule: networks.lora_anima
    networkDim: 8
    networkAlpha: 8.0
    networkTrainUnetOnly: true
    optimizerType: AdamW8bit
    lrScheduler: constant
    learningRate: 5.0e-05
    maxTrainEpochs: 8
    saveEveryNEpochs: 2
    checkpointingEpochs: 2
    captionDropoutRate: 0.1
    timestepSampling: sigmoid
    sigmoidScale: 1.0
    discreteFlowShift: 1.0
    ema: false
    emaDecay: 0.9999
    emaUseNumUpdates: true
    nanGuard: true
    nanGuardRecover: true
    nanGuardMaxConsecutive: 5
    sampleGrid: false
    cacheLatents: true
    cacheLatentsToDisk: true
    cacheTextEncoderOutputs: true
    cacheTextEncoderOutputsToDisk: true
    cacheLlmAdapterOutputs: true
    useShuffledCaptionVariants: true
    staticTokenCount: 4096
    vaeChunkSize: 64
    vaeDisableCache: true
    noHalfVae: false
    attnMode: torch
    xformers: false
    splitAttn: false
    useCustomDownAutograd: true
    blocksToSwap: 24
    gradientCheckpointing: true
    unslothOffloadCheckpointing: false
    cpuOffloadCheckpointing: false
    mixedPrecision: bf16
    useCmmd: false
    maskedLoss: true
    torchCompile: true
    skipCacheCheck: true
    dataloaderPinMemory: true
    persistentDataLoaderWorkers: false
    trimCrossattnKv: false
    saveModelAs: safetensors
    savePrecision: bf16
    logEveryNSteps: 2
    keepTokens: 3
    captionExtension: .txt
    validationSplitNum: 16
    enableBucket: true
    pathPattern: '*'
    lora:
      algorithm: ortho
      useOrtho: true
      lokrFactor: 8
      boftFactors: 4
      useTimestepMask: true
      minRank: 8
      alphaRankScale: 1.0
resume:
  saveState: true
  saveStateAtEnd: true
  skipUntilInitialStep: false
validation:
  everyNEpochs: 1
attention:
  training: auto
  split: false
optimization:
  torchCompile: false
  fusedBackwardPass: false
  fullBf16: false
  fullFp16: false
  blocksToSwap: 0
  fp8Base: false
  fp8BaseUnet: false
  fp8Scaled: false
  fp8VlTextEncoder: false
  lowram: false
  highvram: false
  noHalfVae: false
  disableMmapLoadSafetensors: false
  cpuOffloadCheckpointing: false
  unslothOffloadCheckpointing: false
  cacheTextEncoderOutputs: false
  cacheTextEncoderOutputsToDisk: false
dataloader:
  numWorkers: 8
  persistentWorkers: false
  vaeBatchSize: 1
  cacheShuffleNum: 0
augmentation:
  flip: false
  color: false
  randomCrop: false
  alphaMask: false
