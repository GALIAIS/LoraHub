# Anima character LoRA — optimised
# Backend: diffusion-pipe (Anima = Qwen-Image-style stack: Anima transformer
# + Qwen-Image VAE + Qwen3-0.6B text encoder).
# Optimised for 20-50 character training images on RTX 4090 / 24GB.
# Trade-offs documented below; tweak `blocks_to_swap` for tighter VRAM.

schema_version: "1.0"

base_model:
  arch: anima
  # The "checkpoint" anchor only marks the model identity for the UI;
  # actual per-component paths live under backend.diffusion_pipe.model_paths.
  checkpoint: ./models/circlestone-labs__Anima/split_files/diffusion_models/anima-base-v1.0.safetensors

dataset:
  source: ./datasets/azurlane_char0
  # 1024 is the sweet spot: Qwen-Image was trained at 1024px, going lower
  # discards detail Anima leans on; going higher costs VRAM without real
  # win for character LoRA. Bucketing widened so portrait/landscape crops
  # are not squashed.
  resolution: [1024, 1024]
  bucket:
    enabled: true
    min: 512
    max: 1536
    step: 64
  caption:
    strategy: tag_file
    ext: .txt
    # Aggressive caption shuffle + small drop helps a small character set
    # generalise to new poses/outfits without memorising tag order.
    shuffle: true
    drop_rate: 0.05
  # 8 is the empirical sweet spot on Anima for ~30 image character sets;
  # 10+ tends to cement training-pose artefacts.
  num_repeats: 8

network:
  type: lora
  # rank 32 captures character identity better than rank 16 on Anima's
  # larger transformer; alpha at half the rank is the kohya community
  # default scaling.
  rank: 32
  alpha: 16
  target_unet: true
  # Anima/Qwen-Image LoRA training in dp is transformer-only; the Qwen3
  # text encoder is not trainable from this backend so we leave it off.
  target_text_encoder: false
  # Light network dropout: small character sets overfit fast; 0.05 buys
  # better generalisation with negligible VRAM cost.
  network_dropout: 0.05

optimizer:
  type: adamw8bit
  lr:
    unet: 5.0e-5
    text_encoder: 0
  # Cosine decay (no restarts on dp) is the safe default for short runs.
  schedule: cosine
  warmup_steps: 50

schedule:
  # 12 epochs * num_repeats 8 * 30 imgs / (batch 2 * accum 2) ~ 720 steps;
  # cosine lands the LR within ~5% of zero at the end.
  epochs: 12
  batch_size: 2
  grad_accum: 2
  max_steps: null

precision: bf16
gradient_checkpointing: true
cache_latents: true

# Memory + speed knobs (lorahub OptimizationConfig)
optimization:
  # full_bf16 halves optimiser state memory; combined with adamw8bit the
  # optimiser footprint is negligible.
  full_bf16: true
  # 0 on a 4090; bump to 4-8 on 16GB cards (3070/3080) for VRAM safety.
  blocks_to_swap: 0
  # torch_compile is a kohya knob; dp auto-compiles its pipeline already.
  # fused_backward_pass also kohya-only.
  torch_compile: false
  fused_backward_pass: false

# Sample previews every 3 epochs so you can early-stop a bad run.
sampling:
  enabled: true
  every_n_epochs: 3
  resolution: [1024, 1024]
  seed: 42

output:
  name: azurlane_char0_anima_lora
  save_every_n_epochs: 3
  save_dtype: bf16

backend:
  type: diffusion-pipe
  diffusion_pipe:
    pipeline_stages: 1
    gradient_clipping: 1.0
    # caching_batch_size 4 speeds up the one-time latent precompute pass
    # ~3-4x vs the default 1 with no quality cost.
    caching_batch_size: 4
    steps_per_print: 5
    # compile=true builds a torch.compile graph for the dp pipeline; first
    # epoch is ~30s slower, subsequent epochs run 8-12% faster.
    compile: true
    # Aspect-ratio bucketing widened to 0.4-2.5 so portrait/landscape
    # character art trains without crops.
    min_ar: 0.4
    max_ar: 2.5
    num_ar_buckets: 9
    skip_empty_caption: true
    model_paths:
      transformer_path: ./models/circlestone-labs__Anima/split_files/diffusion_models/anima-base-v1.0.safetensors
      vae_path: ./models/circlestone-labs__Anima/split_files/vae/qwen_image_vae.safetensors
      llm_path: ./models/circlestone-labs__Anima/split_files/text_encoders/qwen_3_06b_base.safetensors
