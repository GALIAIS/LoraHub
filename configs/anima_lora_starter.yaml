# Anima LoRA (anima_lora backend) — 最小可训模板
#
# 这是用 sorryhyun/anima_lora 后端（vendored 在 external/anima_lora/）
# 跑标准 LoRA 的最简配置。LoraHub 会调用上游 train.py：
#   accelerate launch train.py \
#     --method lora \
#     --preset default \
#     --pretrained_model_name_or_path <下面 baseModel.checkpoint> \
#     ...
#
# 前置条件：
#   1. 设置 → 后端安装 → 选 sorryhyun/anima_lora (vendored) → 安装
#      （uv sync 会创建 external/anima_lora/.venv，约 6-8 GB 下载）
#   2. 准备 Anima DiT + QwenImage VAE + Qwen3 三件权重
#   3. 数据集放好（带同名 .txt caption）

schemaVersion: "1.0"

baseModel:
  arch: anima
  # DiT 主权重 — 与 kohya / dp 模板共用的 ./models/ 单一真相源
  checkpoint: ./models/circlestone-labs__Anima/split_files/diffusion_models/anima-base-v1.0.safetensors
  archPaths:
    # QwenImage VAE
    ae: ./models/circlestone-labs__Anima/split_files/vae/qwen_image_vae.safetensors
    # Qwen3 文本编码器
    qwen3: ./models/circlestone-labs__Anima/split_files/text_encoders/qwen_3_06b_base.safetensors

# 数据集 — 形状与 kohya / dp 一致,source 始终指向**原始图片目录**。
# LoraHub 的 anima_lora 后端在 launch 时会检查
# <workspace>/post_image_dataset/lora/ 里的 cache 是否齐全,缺则自动调
# external/anima_lora/preprocess/ 完成 resize → VAE latent → TE embedding
# 全套 cache 后再 spawn train.py。
dataset:
  source: ./datasets/your_dataset
  resolution: [1024, 1024]
  bucket:
    enabled: true
    min: 512
    max: 1536
    step: 64
  caption:
    strategy: tag_file
    ext: .txt
    shuffle: true
    dropRate: 0.1
  numRepeats: 4

# LoraHub 通用 schema 字段 (rank/alpha 等会被忽略，因为下面 backend.animaLora
# 的字段才是真正传给 train.py 的)。但 schema 仍要求填，保持最小默认即可。
network:
  type: lora
  rank: 16
  alpha: 8

optimizer:
  type: AdamW
  lr:
    unet: 5.0e-5
    textEncoder: 5.0e-5
  scheduler:
    type: constant

schedule:
  epochs: 8
  batchSize: 1
  seed: 42

output:
  name: my_anima_lora

# === anima_lora 专属配置 ===
# 这一段才是真正控制 anima_lora 行为的字段。method/preset 决定走 lora.toml
# 还是 chimera/postfix/easycontrol/ip_adapter，下方的旋钮按 method 子配置生效。
backend:
  type: anima_lora

  animaLora:
    # 训练算法。可选 lora / postfix / chimera / easycontrol / ip_adapter
    # 默认 lora 自动堆叠 OrthoLoRA + T-LoRA（与上游 lora.toml 默认一致）。
    method: lora

    # 硬件 preset。可选 default / low_vram / graft / half / quarter / tenth / debug
    # - low_vram: 开 gradient_checkpointing + unsloth_offload (低显存机器选)
    # - half / quarter / tenth: 用部分子集训练（实验/调参用）
    # - debug: 0.1% 数据，纯打通管线
    preset: default

    # LoRA 容量
    networkDim: 16
    networkAlpha: 16

    # Optim
    learningRate: 5.0e-5
    maxTrainEpochs: 8
    saveEveryNEpochs: 2
    checkpointingEpochs: 2
    captionDropoutRate: 0.1

    # 流匹配采样
    timestepSampling: sigmoid
    sigmoidScale: 1.0
    discreteFlowShift: 1.0

    # 缓存（首次训练前会自动写满 post_image_dataset/lora/，第二次起秒进训练）
    cacheLatents: true
    cacheLatentsToDisk: true
    cacheTextEncoderOutputs: true
    cacheTextEncoderOutputsToDisk: true
    cacheLlmAdapterOutputs: true

    # Anima 必须 4096 静态 token
    staticTokenCount: 4096

    # 注意力 / 编译
    attnMode: torch         # 默认 SDPA,始终可用;装了 flash-attn 改成 flash 拿额外 5-15%
    # compileMode: full     # 想开 torch.compile 全编译就解开（与 grad_ckpt 互斥）
    # compileInductorMode: reduce-overhead

    # 显存 offload
    blocksToSwap: 0
    gradientCheckpointing: false
    unslothOffloadCheckpointing: false

    mixedPrecision: bf16

    # method=lora 默认堆叠 OrthoLoRA + T-LoRA 的子配置
    lora:
      useOrtho: true
      useTimestepMask: true
      minRank: 8
      alphaRankScale: 1.0
