# Anima LoRA on Tesla V100 32GB — fp16 compatibility template.
#
# Target hardware: Tesla V100 32GB (sm_70). V100 has fast fp16 tensor cores
# but no native bf16, so this template uses fp16 end-to-end and PyTorch SDPA
# (`attnMode: torch`) instead of flash-attn. It is intentionally more
# conservative than anima_style_32gb_loha.yaml: batch=1, gradAccum=2,
# gradient checkpointing on, cache-to-disk on, no CMMD validation by default.
#
# Note from V100 VPS probe: current anima_lora torch 2.12.1+cu130 does not
# initialize on driver 570.124.04 (CUDA driver 12.8). Install a torch build
# compatible with the server driver before running training.

_template:
  name: Anima LoRA V100 32GB fp16
  description: Tesla V100 32GB 兼容档：fp16、PyTorch SDPA、关闭 bf16/flash 依赖，适合 CUDA 12.x
    驱动环境。
  arch: anima
_placeholders:
- key: name
  label: 输出名称
  path_field: output.name
  placeholder: anima_v100_fp16
- key: checkpoint
  label: Anima base checkpoint
  path_field: baseModel.checkpoint
  placeholder: ./models/diffusion_models/anima-base-v1.0.safetensors
- key: qwen3
  label: Qwen3 text encoder
  path_field: baseModel.archPaths.qwen3
  placeholder: ./models/text_encoders/qwen_3_06b_base.safetensors
- key: vae
  label: Qwen Image VAE
  path_field: baseModel.archPaths.ae
  placeholder: ./models/vae/qwen_image_vae.safetensors
- key: dataset
  label: Dataset directory
  path_field: dataset.source
  placeholder: ./datasets/my_dataset
schemaVersion: '1.0'
baseModel:
  arch: anima
  archVariant: ''
  checkpoint: models\circlestone-labs__Anima\anima-base-v1.0.safetensors
  archPaths:
    ae: models\circlestone-labs__Anima\qwen_image_vae.safetensors
    qwen3: models\circlestone-labs__Anima\qwen_3_06b_base.safetensors
    applyT5AttnMask: false
    applyLgAttnMask: false
    t5DropoutRate: 0.0
    clipLDropoutRate: 0.0
    clipGDropoutRate: 0.0
    posEmbRandomCropRate: 0.0
    enableScaledPosEmbed: false
    vaeDisableCache: false
    textEncoderCpu: false
dataset:
  source: datasets\your_dataset
  resolution:
  - 896
  - 896
  bucket:
    enabled: true
    min: 256
    max: 1536
    step: 64
    noUpscale: false
    skipImageResolution: false
  caption:
    strategy: tag_file
    ext: .txt
    shuffle: true
    dropRate: 0.1
    dropoutEveryNEpochs: 0
    tagDropoutRate: 0.0
    keepTokens: 3
    dropTokens: []
    enableWildcard: false
    weighted: false
    shuffleTags: false
  numRepeats: 1
  valSplit: 0.0
  subsets: []
  frameBuckets:
  - 1
network:
  type: lora
  rank: 32
  alpha: 32
  targetUnet: true
  targetTextEncoder: false
  networkDropout: 0.0
  rankDropout: 0.0
  moduleDropout: 0.0
  baseWeights: []
  baseWeightsMultiplier: []
  fuseAdapters: []
optimizer:
  type: AdamW8bit
  lr:
    unet: 5.0e-05
    textEncoder: 5.0e-05
  schedule: cosine_with_restarts
  warmupSteps: 100
  betas:
  - 0.9
  - 0.999
  weightDecay: 0.0
  eps: 1.0e-08
  optimizerArgs: {}
  maxGradNorm: 1.0
  schedulerArgs: {}
  schedulerNumCycles: 1
  schedulerPower: 1.0
  gradientRelease: false
loss:
  noiseOffset: 0.0
  noiseOffsetRandomStrength: false
  multiresNoiseDiscount: 0.3
  ipNoiseGammaRandomStrength: false
  zeroTerminalSnr: false
  priorLossWeight: 1.0
  lossType: l2
  debiasedEstimation: false
  maskedLoss: false
  scaleVPredLossLikeNoisePred: false
  vParameterization: false
flowMatch: {}
schedule:
  epochs: 8
  batchSize: 1
  gradAccum: 2
  seed: 42
precision: fp16
gradientCheckpointing: true
cacheLatents: true
cacheLatentsToDisk: false
skipCacheCheck: false
cacheInfo: false
trainInpainting: false
sampling:
  enabled: true
  everyNEpochs: 3
  atFirst: false
  prompts:
  - prompt: masterpiece, best quality, score_7, ${TRIGGER}, 1girl, solo, upper body,
      looking at viewer, neutral expression, simple background, soft natural lighting
    negative: lowres, worst quality, bad anatomy, bad hands, missing fingers, blurry,
      jpeg artifacts, deformed, mutated, watermark, signature, text
    cfg: 5.0
    steps: 24
    seed: 42
    width: 1024
    height: 1024
  - prompt: masterpiece, best quality, score_7, ${TRIGGER}, 1girl, solo, full body,
      standing, dynamic pose, looking at viewer, outdoors, daytime, soft sunlight
    negative: lowres, worst quality, bad anatomy, bad hands, missing fingers, extra
      fingers, blurry, jpeg artifacts, deformed, mutated, watermark, text
    cfg: 5.0
    steps: 24
    seed: 1024
    width: 832
    height: 1216
  - prompt: masterpiece, best quality, score_7, ${TRIGGER}, 1girl, solo, close-up,
      smiling, blush, looking at viewer, indoor warm lighting, bokeh background
    negative: lowres, worst quality, bad anatomy, bad hands, blurry, jpeg artifacts,
      deformed, mutated, watermark, text, sad, angry
    cfg: 5.0
    steps: 24
    seed: 7777
    width: 896
    height: 1152
  resolution:
  - 1024
  - 1024
  seed: -1
  outputs:
    gridStitching: true
    baseCompare: false
    crossCkptAnimation: false
    pngMetadata: true
  enableLiveInference: false
  inferenceSteps: 20
  inferenceCfg: 5.0
  spectrumAnalysis: true
output:
  name: anima_v100_fp16
  saveEveryNEpochs: 1
  saveDtype: fp16
  noMetadata: false
  metadata: {}
backend:
  type: anima_lora
  extraArgs: {}
  gpuDispatch:
    mode: one-job-per-gpu
    numGpus: null
  distributed:
    strategy: ddp
    fsdp:
      shardingStrategy: full_shard
      autoWrapPolicy: size_based
      minNumParams: 100000000
      stateDictType: full_state_dict
      cpuOffload: false
    zero:
      stage: 2
      offloadOptimizer: none
      offloadParam: none
      overlapComm: true
  animaLora:
    method: lora
    preset: low_vram
    outputName: anima_v100_fp16
    networkModule: networks.lora_anima
    networkDim: 32
    networkAlpha: 32.0
    networkTrainUnetOnly: true
    channelScalingAlpha: 0.5
    optimizerType: AdamW8bit
    lrScheduler: cosine
    learningRate: 5.0e-05
    lrWarmupRatio: 0.05
    maxTrainEpochs: 6
    saveEveryNEpochs: 3
    checkpointingEpochs: 3
    captionDropoutRate: 0.1
    timestepSampling: sigmoid
    sigmoidScale: 1.0
    discreteFlowShift: 1.0
    ema: false
    emaDecay: 0.9999
    emaUseNumUpdates: true
    nanGuard: true
    nanGuardRecover: true
    nanGuardMaxConsecutive: 5
    sampleGrid: true
    cacheLatents: true
    cacheLatentsToDisk: true
    cacheTextEncoderOutputs: true
    cacheTextEncoderOutputsToDisk: true
    cacheLlmAdapterOutputs: true
    useShuffledCaptionVariants: true
    staticTokenCount: 4096
    vaeChunkSize: 64
    vaeDisableCache: true
    noHalfVae: false
    attnMode: torch
    xformers: false
    splitAttn: false
    compileMode: null
    compileInductorMode: null
    enableNativeFlatten: false
    useCustomDownAutograd: true
    blocksToSwap: 0
    gradientCheckpointing: true
    unslothOffloadCheckpointing: false
    cpuOffloadCheckpointing: false
    mixedPrecision: fp16
    useCmmd: false
    maskedLoss: false
    torchCompile: true
    skipCacheCheck: true
    dataloaderPinMemory: true
    persistentDataLoaderWorkers: true
    trimCrossattnKv: false
    saveModelAs: safetensors
    savePrecision: fp16
    logEveryNSteps: 2
    keepTokens: 3
    captionExtension: .txt
    validationSplitNum: 0
    enableBucket: true
    pathPattern: '*'
    lora:
      algorithm: ortho
      useOrtho: true
      lokrFactor: 8
      boftFactors: 4
      useTimestepMask: true
      minRank: 16
      alphaRankScale: 1.0
resume:
  saveState: true
  saveStateAtEnd: true
  skipUntilInitialStep: false
validation:
  everyNEpochs: 1
attention:
  training: torch
  split: false
optimization:
  torchCompile: false
  fusedBackwardPass: false
  fullBf16: false
  fullFp16: false
  blocksToSwap: 0
  fp8Base: false
  fp8BaseUnet: false
  fp8Scaled: false
  fp8VlTextEncoder: false
  lowram: false
  highvram: false
  noHalfVae: false
  disableMmapLoadSafetensors: false
  cpuOffloadCheckpointing: false
  unslothOffloadCheckpointing: false
  cacheTextEncoderOutputs: false
  cacheTextEncoderOutputsToDisk: false
dataloader:
  numWorkers: 8
  persistentWorkers: false
  vaeBatchSize: 1
  cacheShuffleNum: 0
augmentation:
  flip: false
  color: false
  randomCrop: false
  alphaMask: false
monitoring:
  enableWandb: true
  tags: []
