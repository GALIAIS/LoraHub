# Anima character LoRA on the anima_lora backend — 8GB notebook recipe.
#
# Target hardware: RTX 3060 / 3070 / 4060 / 4070 mobile (8 GB VRAM, 16-32 GB RAM).
# Expected throughput: ~6-12 s/step, ~30-60 min for 30 images × 6 epochs.
# Expected VRAM peak: ~7.0-7.5 GB (with 1.5 GB headroom for desktop GUI).
#
# Why these knobs (in budget order):
#   * resolution 768²        — 2304 tokens vs 1024² 4096; -45 % activation memory
#   * blocks_to_swap = 24    — keeps 4/28 DiT blocks on GPU; -55 % weight memory
#   * unsloth_offload_checkpointing + cpu_offload_checkpointing — activation
#                              tensors live on CPU between forward/backward
#   * AdamW8bit              — optimizer state shrinks 4x vs fp32 AdamW
#   * algorithm = dora       — same storage cost as plain LoRA, ~0.5 dB
#                              better identity recall on small datasets
#   * compile_inductor_mode = default — disables cudagraph_trees so EMA's
#                              shadow.copy_() doesn't trip the liveness check
#   * EMA + nan_guard        — both are mostly free at 8 GB scale and protect
#                              long pause/resume loops on a laptop
#
# Tuning knobs to know:
#   - OOM during forward     → blocks_to_swap += 4 (max 26 for Anima)
#   - OOM during sample      → keep sampling.enabled = false (set below)
#   - Loss diverges          → drop learning_rate to 3e-5
#   - Trigger word too weak  → caption_dropout 0.0 + num_repeats += 2
#   - Slow throughput (<3 s/step) → laptop in power-saver, plug in / disable battery throttling

schemaVersion: "1.0"

baseModel:
  arch: anima
  # Edit these three to point at your local anima checkpoints. The default
  # paths assume `lorahub self install` ran the model download routine and
  # the files live under <project>/models/.
  checkpoint: ./models/diffusion_models/anima-base-v1.0.safetensors
  archPaths:
    qwen3: ./models/text_encoders/qwen_3_06b_base.safetensors
    ae: ./models/vae/qwen_image_vae.safetensors
    # Cap qwen3 token length — long captions blow up TE intermediate buffers
    # well before the cached-output path saves us.
    qwen3MaxTokenLength: 384

dataset:
  # Edit this path to your character image folder. Each image needs a
  # matching .txt caption (smart-caption it via `lorahub captions smart`).
  source: ./datasets/your_character
  # 768² is the 8 GB sweet spot. 896² occasionally fits with grad ckpt
  # but margins are tight. Drop to 640² if you OOM and need more cushion.
  resolution: [768, 768]
  bucket:
    enabled: true
    min: 384
    max: 1024
    step: 64
  caption:
    strategy: tag_file
    ext: .txt
    shuffle: true
    # Low caption dropout for character work — every caption usually carries
    # identity-relevant tokens (1girl, hair colour, eye colour, outfit).
    dropRate: 0.05
    keepTokens: 1
  # 6 repeats × 30 images / batch 1 / accum 8 / 6 epochs = ~135 steps.
  # Faces train fine on this many; over-repeating just hammers the same
  # ~30 frames into the network and starts memorising backgrounds.
  numRepeats: 6

schedule:
  epochs: 6
  batchSize: 1
  # Effective batch 8 at 768² is what AdamW8bit was designed for.
  gradAccum: 8
  seed: 42
  maxSteps: null

precision: bf16
gradientCheckpointing: true
cacheLatents: true
cacheLatentsToDisk: true
skipCacheCheck: true

sampling:
  # Disabled by default — sampling adds a 1-2 GB transient peak that 8 GB
  # cards can't absorb on top of training. Re-enable after a few epochs
  # complete cleanly if you want preview images.
  enabled: false

output:
  name: character_anima_8gb
  saveEveryNEpochs: 2
  saveDtype: bf16

backend:
  type: anima_lora
  animaLora:
    method: lora
    preset: low_vram
    outputName: character_anima_8gb

    # Algorithm: DoRA — a strict superset of plain LoRA at the same parameter
    # count. The magnitude column captures identity scale that LoRA's pure
    # rank-r delta has to fight against; on character datasets this typically
    # means the LoRA learns identity at a smaller rank.
    lora:
      algorithm: dora
      # T-LoRA timestep mask still composes with DoRA — high-noise steps use
      # smaller rank (skipping fine details), low-noise steps see full rank.
      useTimestepMask: true
      minRank: 4
      alphaRankScale: 1.0

    # Network sizing.
    networkDim: 8                 # ~half of the 24GB recipe's 16; faces still train cleanly
    networkAlpha: 8.0             # alpha == dim is the safe default for DoRA
    networkTrainUnetOnly: true

    # Optimizer.
    optimizerType: AdamW8bit      # bitsandbytes; ~4x smaller optimiser state than fp32 AdamW
    lrScheduler: cosine
    learningRate: 5.0e-05
    maxTrainEpochs: 6
    saveEveryNEpochs: 2
    checkpointingEpochs: 2
    captionDropoutRate: 0.05

    # Flow-matching sampling.
    timestepSampling: sigmoid
    sigmoidScale: 1.0
    discreteFlowShift: 1.0
    # Min-SNR-γ over rectified flow — gentle on character training, helps
    # late steps converge without changing peak VRAM.
    weightingScheme: min_snr_rf
    minSnrGamma: 5.0

    # Caching: every output goes to disk so 8 GB GPU RAM stays free for the
    # forward pass.
    cacheLatents: true
    cacheLatentsToDisk: true
    cacheTextEncoderOutputs: true
    cacheTextEncoderOutputsToDisk: true
    cacheLlmAdapterOutputs: true
    useShuffledCaptionVariants: true
    staticTokenCount: 4096
    vaeChunkSize: 1               # one image at a time through VAE — single biggest cache-time saving on 8 GB

    # Attention. ``torch`` is PyTorch SDPA — universally available, ~85-95 %
    # of flash-attn throughput. Don't switch to flash unless you know
    # flash-attn 2 is installed for your CUDA version.
    attnMode: torch

    # No torch.compile here. cudagraph_trees does not co-exist with EMA's
    # shadow update; the LoraHub compiler force-overrides this anyway when
    # ema=true, but setting it explicitly silences the warning.
    compileMode: null
    compileInductorMode: default
    torchCompile: false

    # Memory / offload (the actual work).
    # NOTE: blocks_to_swap is mutually exclusive with
    # cpu_offload_checkpointing in anima_lora's train.py (asserts at
    # startup). We pick blocks_to_swap because it's the bigger win at
    # 8 GB; unsloth_offload_checkpointing still composes with it and
    # delivers most of the activation-offload benefit.
    blocksToSwap: 24              # 24/28 DiT blocks live on CPU; ~5.5 GB freed
    gradientCheckpointing: true
    unslothOffloadCheckpointing: true
    cpuOffloadCheckpointing: false
    mixedPrecision: bf16

    # Training stabilisers (cheap on 8 GB; pay back on long laptop sessions).
    ema: true
    emaDecay: 0.9999
    emaUseNumUpdates: true
    nanGuard: true
    nanGuardRecover: true
    nanGuardMaxConsecutive: 5

    # Output / save.
    saveModelAs: safetensors
    savePrecision: bf16
    logEveryNSteps: 5
    keepTokens: 1
    captionExtension: .txt
    validationSplitNum: 0         # validation pass costs another VRAM peak; skip on 8 GB
    enableBucket: true
    pathPattern: '*'
