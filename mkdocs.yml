site_name: LoraHub
site_description: 自托管的 LoRA 训练工作台。
site_url: https://galiais.github.io/LoraHub/
repo_url: https://github.com/GALIAIS/LoraHub
repo_name: GALIAIS/LoraHub
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 GALIAIS &mdash; AGPL-3.0-or-later

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色
  icon:
    repo: fontawesome/brands/github

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GALIAIS/LoraHub

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - 首页: index.md
  - 上手:
      - 安装: getting-started/install.md
      - 快速开始: getting-started/quickstart.md
      - 端到端教程: getting-started/smoke-test.md
  - 配置:
      - 概览: configs/index.md
      - 模板: configs/templates.md
      - 字段参考: configs/fields.md
  - CLI:
      - 概览: cli/index.md
      - 命令参考: cli/commands.md
  - API:
      - 概览: api/index.md
      - 端点: api/endpoints.md

