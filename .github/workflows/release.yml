name: Release

# Triggers when a `vX.Y.Z` tag is pushed. The workflow:
#   1. checks out the full repo history (hatch-vcs needs it),
#   2. validates that the running tag matches what `pip install -e .`
#      resolves at build time (catches stale tag pattern config),
#   3. builds a Python wheel + sdist and a versioned web/dist bundle,
#   4. pulls the matching CHANGELOG.md section as release notes,
#   5. publishes a GitHub Release with the wheel + sdist + a zipped
#      web/dist bundle attached.
#
# We deliberately do NOT push to PyPI from here — keep the surface
# small until there's an external user that asks for it.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  # `gh release create` writes back to the repo as the workflow's
  # ephemeral GITHUB_TOKEN; the default `read` scope isn't enough.
  contents: write

jobs:
  release:
    name: Build wheel + publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs needs full history to resolve the tag.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Resolve tag
        id: tag
        run: |
          # ${GITHUB_REF#refs/tags/} strips the `refs/tags/` prefix
          # leaving e.g. `v0.3.0`. The version (no `v`) is used for
          # filenames so artefacts download as `lorahub-0.3.0-...`.
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Tag: $tag · Version: $version"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling hatch-vcs

      - name: Build wheel + sdist
        run: |
          python -m build --wheel --sdist
          ls -la dist/

      - name: Verify wheel version matches tag
        run: |
          set -euo pipefail
          # The wheel filename embeds the resolved version. If hatch-vcs
          # disagrees with the tag we want CI to scream rather than
          # publish a mismatched artefact.
          expected="${{ steps.tag.outputs.version }}"
          wheel=$(ls dist/lorahub-*.whl | head -n1)
          # `lorahub-0.3.0-py3-none-any.whl` -> `0.3.0`
          got=$(basename "$wheel" | sed -E 's/^lorahub-([^-]+)-.*\.whl$/\1/')
          echo "Expected: $expected · Wheel reports: $got"
          if [[ "$got" != "$expected" ]]; then
            echo "::error::wheel version $got does not match tag $expected"
            exit 1
          fi

      - name: Build web bundle
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Pack web/dist as a versioned zip
        run: |
          cd web/dist
          zip -r "../../dist/lorahub-web-${{ steps.tag.outputs.version }}.zip" .

      - name: Extract CHANGELOG section
        id: changelog
        run: |
          set -euo pipefail
          # Pull the section bracketed by `## [<version>]` and the next
          # `## [` heading. POSIX-style `[[]` / `[]]` are used in place
          # of `\[` / `\]` because gawk warns on those escapes and the
          # mojibake risk isn't worth it. If no section exists, fall
          # back to a one-line note pointing at the tag — better than
          # silently publishing an empty release body.
          version="${{ steps.tag.outputs.version }}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          if grep -q "^## \[$version\]" CHANGELOG.md; then
            awk -v ver="$version" '
              BEGIN { pat = "^## [[]" ver "[]]" }
              $0 ~ pat { take=1; next }
              take && /^## [[]/ { exit }
              take { print }
            ' CHANGELOG.md > "$notes_file"
            # Trim leading/trailing blanks.
            awk 'NF{p=1} p' "$notes_file" \
              | sed -E -e :a -e '/^$/{$d;N;ba' -e '}' \
              > "$notes_file.trim"
            mv "$notes_file.trim" "$notes_file"
            echo "Extracted $(wc -l < "$notes_file") lines from CHANGELOG.md"
          else
            echo "No CHANGELOG entry for $version; using a stub." >&2
            printf 'Release %s.\n\nSee https://github.com/%s/commits/%s for the full diff.\n' \
              "$version" "$GITHUB_REPOSITORY" "${{ steps.tag.outputs.tag }}" \
              > "$notes_file"
          fi
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes-file "${{ steps.changelog.outputs.notes_file }}" \
            dist/lorahub-${{ steps.tag.outputs.version }}*.whl \
            dist/lorahub-${{ steps.tag.outputs.version }}*.tar.gz \
            dist/lorahub-web-${{ steps.tag.outputs.version }}.zip
