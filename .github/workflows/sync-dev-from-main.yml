name: Sync dev from main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-dev-from-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.LORAHUB_SYNC_TOKEN || github.token }}

      - name: Fast-forward dev only when it is behind main
        shell: bash
        run: |
          set -euo pipefail

          git fetch --prune origin main dev

          if ! git show-ref --verify --quiet refs/remotes/origin/dev; then
            echo "origin/dev does not exist; skipping."
            exit 0
          fi

          if git merge-base --is-ancestor origin/dev origin/main; then
            if git merge-base --is-ancestor origin/main origin/dev; then
              echo "dev already matches main; skipping."
              exit 0
            fi
            echo "dev is behind main; fast-forwarding dev."
            if ! output="$(git push origin origin/main:dev 2>&1)"; then
              echo "$output"
              if grep -q "Repository rule violations" <<<"$output"; then
                echo "Repository rules rejected direct pushes to dev; add a ruleset bypass for GitHub Actions or sync dev through a PR."
                exit 1
              fi
              exit 1
            fi
          else
            echo "dev is ahead of or diverged from main; skipping."
          fi
