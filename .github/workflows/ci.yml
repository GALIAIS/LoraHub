name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs walks git history to derive the version; without
          # the full clone it can't see the most recent tag and falls
          # back to `0.0.0`, which fails any test that asserts on the
          # version shape.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check lorahub tests

      - name: Type check (mypy)
        run: mypy lorahub

      - name: Test (pytest)
        run: python -m pytest -v --tb=short

  web:
    name: web build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The vite config runs `git describe` to embed the user-facing
          # version; a shallow clone leaves it at `dev` for every CI
          # build, which is fine but masks a real failure mode.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web frontend
        working-directory: web
        run: npm run build
